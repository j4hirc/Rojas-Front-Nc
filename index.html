    <script type="module" src="main.js"></script>

    <script>
        const canvas  = document.getElementById('bg-canvas');
        const ctx     = canvas.getContext('2d');
        const PALETTE = ['#12CFF4','#F4A300','#c8eef7','#fde8b0','#dde8ed','#e8f4fb'];
        let triangles = [];

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function buildTriangles() {
            triangles = [];
            const cw = 90, ch = 78;
            const cols = Math.ceil(canvas.width  / cw) + 1;
            const rows = Math.ceil(canvas.height / ch) + 1;
            const W    = canvas.width  / (cols - 1);
            const H    = canvas.height / (rows - 1);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * W, y = r * H;
                    const j = () => (Math.random() - 0.5) * W * 0.45;
                    triangles.push({
                        pts:   [[x+j(), y+j()], [x+W+j(), y+j()], [x+j(), y+H+j()]],
                        alpha: 0.06 + Math.random() * 0.12,
                        color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
                        speed: 0.00012 + Math.random() * 0.00025,
                        phase: Math.random() * Math.PI * 2
                    });
                    triangles.push({
                        pts:   [[x+W+j(), y+j()], [x+W+j(), y+H+j()], [x+j(), y+H+j()]],
                        alpha: 0.06 + Math.random() * 0.12,
                        color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
                        speed: 0.00012 + Math.random() * 0.00025,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        resize();
        buildTriangles();
        window.addEventListener('resize', () => { resize(); buildTriangles(); });

        let t = 0;
        function draw() {
            t++;
            ctx.fillStyle = '#f0f8fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            triangles.forEach(tri => {
                const a = tri.alpha + Math.sin(t * tri.speed * 60 + tri.phase) * 0.04;
                ctx.beginPath();
                ctx.moveTo(tri.pts[0][0], tri.pts[0][1]);
                ctx.lineTo(tri.pts[1][0], tri.pts[1][1]);
                ctx.lineTo(tri.pts[2][0], tri.pts[2][1]);
                ctx.closePath();
                ctx.globalAlpha = Math.max(0.03, a);
                ctx.fillStyle   = tri.color;
                ctx.fill();
                ctx.globalAlpha = 0.18;
                ctx.strokeStyle = tri.color;
                ctx.lineWidth   = 0.5;
                ctx.stroke();
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(draw);
        }
        draw();
    </script>
