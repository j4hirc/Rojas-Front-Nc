<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajos - Rojas Remodeling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="../usuarios/usuarios.css">
    <style>
        /* ==================== CSS RESPONSIVO PARA TRABAJOS ==================== */
        .header-section {
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header-section h2 {
            white-space: nowrap;
        }

        #searchJobInput {
            min-width: 220px;
        }

        .filters-bar {
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        /* Mobile Cards */
        .mobile-cards {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .job-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .job-card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #0f4c81;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Mapa en modal */
        #jobMap {
            height: 280px !important;
            border-radius: 12px;
            border: 1px solid #E0E5F2;
        }

        /* Mejora modal en móviles */
        @media (max-width: 768px) {
            .modal-container {
                width: 96% !important;
                margin: 10px auto;
                max-height: 95vh;
            }
            
            .modal-body {
                padding: 18px !important;
                max-height: 70vh;
                overflow-y: auto;
            }
            
            .form-row {
                grid-template-columns: 1fr !important;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar (se mantiene igual) -->
        <aside class="sidebar">
            <!-- ... tu sidebar actual ... -->
            <div class="sidebar-logo">
                <img src="../../img/logo.png" alt="Rojas Remodeling">
            </div>
            <nav class="sidebar-nav">
                <a href="../admin-dashboard.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="../usuarios/usuarios.html"><i class="fa-solid fa-users-gear"></i> Usuarios</a>
                <a href="trabajos.html" class="active"><i class="fa-solid fa-hammer"></i> Trabajos</a>
                <a href="../evidencias/evidencias.html"><i class="fa-solid fa-camera"></i> Evidencias</a>
                <a href="../categorias/categorias.html"><i class="fa-solid fa-tags"></i> Categorías</a>
                <a href="../materiales/materiales.html"><i class="fa-solid fa-boxes-stacked"></i> Materiales</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="page-title">Gestión de Trabajos (Proyectos)</div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="admin-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container">

                    <div class="header-section">
                        <h2 style="margin:0; color:#2B3674;">Proyectos Asignados</h2>
                        
                        <div style="display:flex; flex-wrap:wrap; gap:15px; flex:1; align-items:flex-end;">
                            <div style="flex:1; min-width:220px;">
                                <label style="display:block; font-size:.85rem; font-weight:bold; color:#0f4c81; margin-bottom:5px;">
                                    Buscar por Cliente o Descripción
                                </label>
                                <input type="text" id="searchJobInput" class="input-field" placeholder="🔍 Escribe un nombre o descripción...">
                            </div>

                            <div style="width:260px; min-width:180px;">
                                <label style="display:block; font-size:.85rem; font-weight:bold; color:#0f4c81; margin-bottom:5px;">
                                    Estado
                                </label>
                                <select id="filterStatusInput" class="input-field">
                                    <option value="ALL">Todos los Estados</option>
                                    <option value="PENDING">Pendiente</option>
                                    <option value="IN_PROGRESS">En Progreso</option>
                                    <option value="COMPLETED">Completado</option>
                                    <option value="CANCELLED">Cancelado</option>
                                </select>
                            </div>

                            <button class="btn-add" onclick="abrirModalCrearJob()" style="height:48px; white-space:nowrap;">
                                <i class="fa-solid fa-plus"></i> Nuevo Trabajo
                            </button>
                        </div>
                    </div>

                    <div class="table-container" style="margin-top:20px;">
                        <table class="user-table" style="min-width:900px;">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Dirección y Fecha</th>
                                    <th>Descripción</th>
                                    <th>Subcontratista / Manager</th>
                                    <th>Estado</th>
                                    <th>Prioridad</th>
                                    <th>Pago ($)</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="jobTableBody"></tbody>
                        </table>
                    </div>

                    <!-- Mobile Cards -->
                    <div class="mobile-cards" id="mobileCardsContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal (sin cambios importantes) -->
    <div class="modal-overlay" id="modalJob">
        <!-- ... tu modal actual ... -->
    </div>

    <script type="module" src="trabajos.js"></script>
</body>
</html>
