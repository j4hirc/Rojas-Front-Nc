<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiales - Rojas Remodeling</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="materiales.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../../img/logo.png" alt="Rojas Remodeling">
            </div>

            <nav class="sidebar-nav">
                <a href="../admin-dashboard.html">
                    <i class="fa-solid fa-house"></i> Inicio
                </a>
                <a href="../usuarios/usuarios.html">
                    <i class="fa-solid fa-users-gear"></i> Usuarios
                </a>
                <a href="../trabajos/trabajos.html">
                    <i class="fa-solid fa-hammer"></i> Trabajos
                </a>
                <a href="../evidencias/evidencias.html">
                    <i class="fa-solid fa-camera"></i> Evidencias
                </a>
                <a href="categorias.html" class="active">
                    <i class="fa-solid fa-tags"></i> Categorías
                </a>
        
                <a href="../materiales/materiales.html">
                    <i class="fa-solid fa-boxes-stacked"></i> Materiales
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">

            <header class="top-navbar">
                <div class="page-title">Inventario de Materiales</div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="admin-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="materiales-container">

                    <div class="header-section">
                        <h2 style="margin: 0; color: var(--navy); font-weight: 700; font-size: 1.4rem;">Listado de
                            Materiales</h2>


                        <div class="filters-wrapper">
                            <div style="position: relative; width: 100%; max-width: 250px;">
                                <i class="fa-solid fa-magnifying-glass"
                                    style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #A3AED0;"></i>
                                <input type="text" id="buscadorMaterial" class="input-field"
                                    placeholder="Buscar por nombre..." style="padding-left: 40px; width: 100%;"
                                    onkeyup="buscarMaterial()">
                            </div>

                            <div style="width: 100%; max-width: 200px;">
                                <select id="filtroCategoria" class="input-field" style="padding-top: 10px; padding-bottom: 10px; cursor: pointer;" onchange="buscarMaterial()">
                                    <option value="todos">Todas las categorías</option>
                                </select>
                            </div>

                            <button class="btn-add" onclick="abrirModalCrearMat()">
                                <i class="fa-solid fa-plus"></i> Nuevo Material
                            </button>
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="user-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre del Material</th>
                                    <th style="text-align: center;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="materialTableBody">
                            </tbody>
                        </table>
                    </div>

                    <div class="mobile-cards" id="mobileCardsContainer">
                    </div>

                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalMaterial">
        <div class="modal-container">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-box" style="color: var(--primary);"></i> Nuevo
                    Material</span>
                <button onclick="cerrarModalMat()" class="btn-close-modal">✕</button>
            </div>

            <div class="modal-body">
                <form id="formMaterial">
                    <input type="hidden" id="materialId">

                    <div class="form-group">
                        <label>Nombre del Material</label>
                        <input type="text" id="materialName" class="input-field" required
                            placeholder="Ej: Cemento Portland">
                    </div>

                    <div class="form-group" style="margin-top: 15px;">
                        <label>Categoría</label>
                        <select id="matCategory" class="input-field" required>
                            <option value="">Cargando categorías...</option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button onclick="cerrarModalMat()" class="btn-secondary">Cancelar</button>
                <button onclick="guardarMaterial()" class="btn-primary">Guardar</button>
            </div>
        </div>
    </div>

    <script src="materiales.js"></script>
</body>

</html>
