<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Rojas Remodeling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-helmet-safety"></i>
                <span>Rojas Admin</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="active">
                    <i class="fa-solid fa-house"></i> Inicio
                </a>
                <a href="usuarios/usuarios.html">
                    <i class="fa-solid fa-users-gear"></i> Usuarios
                </a>
                <a href="categorias/categorias.html">
                    <i class="fa-solid fa-tags"></i> Categorías
                </a>
                <a href="#" onclick="Swal.fire('¡Pronto!', 'Módulo en construcción', 'info')">
                    <i class="fa-solid fa-hammer"></i> Trabajos
                </a>
                <a href="#" onclick="Swal.fire('¡Pronto!', 'Módulo en construcción', 'info')">
                    <i class="fa-solid fa-boxes-stacked"></i> Materiales
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="top-navbar">
                <div class="page-title">Panel de Control General</div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="admin-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="grid-cards">
                    <div class="card card-blue" onclick="window.location.href='usuarios/usuarios.html'">
                        <div class="card-icon-container"><i class="fa-solid fa-users-gear"></i></div>
                        <div class="card-info">
                            <h3>Usuarios</h3>
                            <p>Total registrados: <strong id="stat-total-users">...</strong></p>
                        </div>
                    </div>

                    <div class="card card-green" onclick="window.location.href='categorias/categorias.html'">
                        <div class="card-icon-container"><i class="fa-solid fa-tags"></i></div>
                        <div class="card-info">
                            <h3>Categorías</h3>
                            <p>Tipos de proyectos</p>
                        </div>
                    </div>

                    <div class="card card-orange" onclick="Swal.fire('¡Próximamente!', 'Módulo de Trabajos.', 'info')">
                        <div class="card-icon-container"><i class="fa-solid fa-hammer"></i></div>
                        <div class="card-info">
                            <h3>Trabajos Activos</h3>
                            <p>En progreso</p>
                        </div>
                    </div>

                    <div class="card card-slate" onclick="Swal.fire('¡Próximamente!', 'Módulo de Materiales.', 'info')">
                        <div class="card-icon-container"><i class="fa-solid fa-boxes-stacked"></i></div>
                        <div class="card-info">
                            <h3>Materiales</h3>
                            <p>Gestión de inventario</p>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="admin-dashboard.js"></script>
</body>
</html>
