<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Rojas Remodeling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="../admin.css"> 
    <link rel="stylesheet" href="../usuarios/usuarios.css"> 
</head>
<body>

    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-helmet-safety"></i>
                <span>Rojas Admin</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="../admin-dashboard.html">
                    <i class="fa-solid fa-house"></i> Inicio
                </a>
                <a href="../usuarios/usuarios.html">
                    <i class="fa-solid fa-users-gear"></i> Usuarios
                </a>
                <a href="categorias.html" class="active">
                    <i class="fa-solid fa-tags"></i> Categorías
                </a>
                <a href="../trabajos/trabajos.html">
                    <i class="fa-solid fa-hammer"></i> Trabajos
                </a>
                <a href="../materiales/materiales.html">
                    <i class="fa-solid fa-boxes-stacked"></i> Materiales
                </a>
                <a href="../evidencias/evidencias.html">
                    <i class="fa-solid fa-camera"></i> Evidencias
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="top-navbar">
                <div class="page-title">Gestión de Categorías</div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="admin-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container" style="margin-top: 0;">
                    
                    <div class="header-section">
                        <h2 style="margin: 0; color: #2B3674;">Lista de Categorías</h2>
                        <button class="btn-add" onclick="abrirModalCrearCat()" style="background: #2e7d32;">
                            <i class="fa-solid fa-plus"></i> Nueva Categoría
                        </button>
                    </div>

                    <div class="table-container">
                        <table class="user-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre de la Categoría</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="catTableBody"></tbody>
                        </table>
                    </div>

                    <div class="mobile-cards" id="mobileCardsContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalCat">
        <div class="modal-container" style="max-width: 450px;">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-tag"></i> Categoría</span>
                <button onclick="cerrarModalCat()" class="btn-close-modal">✕</button>
            </div>
            
            <div class="modal-body">
                <form id="formCat">
                    <input type="hidden" id="catId"> 
                    <div class="form-group">
                        <label>Nombre de Categoría</label>
                        <input type="text" id="catName" class="input-field" required placeholder="Ej: Remodelación de Cocina">
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button onclick="cerrarModalCat()" class="btn-secondary">Cancelar</button>
                <button onclick="guardarCategoria()" class="btn-primary" style="background: #2e7d32;">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module" src="categorias.js"></script>
</body>
</html>
