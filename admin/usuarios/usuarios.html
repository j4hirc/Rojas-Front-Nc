<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Rojas Remodeling</title>
    <link rel="icon" type="image/png" href="../../image.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="../admin.css"> 
    <link rel="stylesheet" href="usuarios.css">
</head>
<style>
        /* Ajuste para que los filtros no se rompan en pantallas pequeñas */
        @media (max-width: 900px) {
            .header-section {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 15px;
            }
            .filters-wrapper {
                flex-direction: column;
                width: 100%;
            }
            .filters-wrapper > div { width: 100% !important; }
            .btn-add { width: 100%; justify-content: center; }
        }
    </style>
<body>

    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../../img/logo.png" alt="Rojas Remodeling">
            </div>
            
            <nav class="sidebar-nav">
                <a href="../admin-dashboard.html">
                    <i class="fa-solid fa-house"></i> Inicio
                </a>
                <a href="usuarios.html" class="active">
                    <i class="fa-solid fa-users-gear"></i> Usuarios
                </a>
                <a href="../trabajos/trabajos.html">
                    <i class="fa-solid fa-hammer"></i> Trabajos
                </a>
                <a href="../evidencias/evidencias.html">
                    <i class="fa-solid fa-camera"></i> Evidencias
                </a>
                <a href="../categorias/categorias.html">
                    <i class="fa-solid fa-tags"></i> Categorías
                </a>
                <a href="../materiales/materiales.html">
                    <i class="fa-solid fa-boxes-stacked"></i> Materiales
                </a>
                
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="top-navbar">
                <div class="page-title">Gestión de Usuarios</div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="admin-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container" style="margin-top: 0;">
                    
                    <div class="header-section" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #F4F7FE;">
                        <h2 style="margin: 0; color: #0B0B0D; font-weight: 700; font-size: 1.4rem;">Directorio del Personal</h2>
                        
                        <div class="filters-wrapper" style="display: flex; gap: 15px; align-items: center;">
                            
                            <div style="position: relative; width: 220px;">
                                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8a9099;"></i>
                                <input type="text" id="buscadorDni" class="input-field" placeholder="Buscar por DNI..." style="padding-left: 40px; padding-top: 10px; padding-bottom: 10px; width: 100%; border: 1px solid #E0E5F2; border-radius: 8px; font-size: 0.9rem;" oninput="buscarPorDni()">
                            </div>

                            <select id="filtroEstado" class="input-field" style="padding: 10px 15px; cursor: pointer; font-weight: 600; color: #2E3238; border: 1px solid #E0E5F2; border-radius: 8px; font-size: 0.9rem; background-color: #F9FAFC;" onchange="cargarUsuarios()">
                                <option value="Active">Empleados Activos</option>
                                <option value="Unemployed">Desempleados</option>
                                <option value="All">Ver Todos</option>
                            </select>

                            <button class="btn-add" onclick="abrirModalCrear()" style="white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 10px 20px; font-size: 0.9rem;">
                                <i class="fa-solid fa-plus"></i> Nuevo Usuario
                            </button>

                        </div>
                    </div>

                    <div class="table-container">
                        <table class="user-table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Teléfono</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody"></tbody>
                        </table>
                    </div>

                    <div class="mobile-cards" id="mobileCardsContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalUsuario">
        <div class="modal-container">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-user-plus" style="color: #12CFF4;"></i> Nuevo Usuario</span>
                <button onclick="cerrarModal()" class="btn-close-modal">✕</button>
            </div>

            <div class="modal-body">
                <form id="formUsuario">
                    <input type="hidden" id="userId"> 
                    <div class="form-grid">
                        <div class="form-row">
                            <div class="form-group">
                                <label>DNI</label>
                                <input type="text" id="userDni" class="input-field" required placeholder="10 dígitos">
                            </div>
                            <div class="form-group">
                                <label>Título (Ej. Ingeniero)</label>
                                <input type="text" id="userTitle" class="input-field" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Primer Nombre</label>
                                <input type="text" id="userFirstName" class="input-field" required>
                            </div>
                            <div class="form-group">
                                <label>Segundo Nombre</label>
                                <input type="text" id="userMiddleName" class="input-field">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Primer Apellido</label>
                                <input type="text" id="userLastName" class="input-field" required>
                            </div>
                            <div class="form-group">
                                <label>Segundo Apellido</label>
                                <input type="text" id="userSecondSurname" class="input-field">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Correo Electrónico</label>
                                <input type="email" id="userEmail" class="input-field" required>
                            </div>
                            <div class="form-group">
                                <label>Teléfono</label>
                                <input type="text" id="userPhone" class="input-field" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Contraseña</label>
                                <input type="password" id="userPassword" class="input-field" placeholder="Requerida para nuevos" required>
                            </div>
                            <div class="form-group">
                                <label>Estado</label>
                                <select id="userStatus" class="input-field" required>
                                    <option value="Active">Activo</option>
                                    <option value="Unemployed">Inactivo / Despedido</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Fecha de Nacimiento</label>
                                <input type="date" id="userBirth" class="input-field" required>
                            </div>
                            <div class="form-group">
                                <label>Fecha de Ingreso</label>
                                <input type="date" id="userEntry" class="input-field" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Roles (Puedes seleccionar varios)</label>
                            <div style="display: flex; gap: 15px; background: rgba(18, 207, 244, 0.05); padding: 15px; border: 1px solid rgba(18, 207, 244, 0.2); border-radius: 12px; flex-wrap: wrap;">
                                <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; color: #2E3238;">
                                    <input type="checkbox" name="userRoles" value="ROLE_EMPLOYEE"> Subcontratista
                                </label>
                                <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; color: #2E3238;">
                                    <input type="checkbox" name="userRoles" value="ROLE_JEFE"> Manager
                                </label>
                                <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; color: #2E3238;">
                                    <input type="checkbox" name="userRoles" value="ROLE_ADMIN"> Administrador
                                </label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button onclick="cerrarModal()" class="btn-secondary">Cancelar</button>
                <button onclick="guardarUsuario()" class="btn-primary">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module" src="usuarios.js"></script>
</body>
</html>
