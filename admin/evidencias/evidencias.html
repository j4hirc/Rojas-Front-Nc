<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidencias - Rojas Remodeling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../admin.css"> 
    <link rel="stylesheet" href="../usuarios/usuarios.css"> 

    <style>
        /* Estilos específicos para la galería de evidencias */
        .timeline-update {
            background: #F9FAFC; border-left: 4px solid #0f4c81; padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0;
        }
        .timeline-date { font-size: 0.8rem; color: #666; font-weight: 600; margin-bottom: 5px; display: block;}
        .timeline-comment { font-size: 0.95rem; color: #2B3674; margin-bottom: 10px; }
        .gallery-grid { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .gallery-img { 
            width: 80px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; 
            border: 2px solid #E0E5F2; transition: transform 0.2s;
        }
        .gallery-img:hover { transform: scale(1.05); border-color: #0f4c81; }
        .empty-state { text-align: center; color: #A3AED0; padding: 30px; font-weight: 500; }

        /* NUEVO: ESTILO PARA EL BOTÓN DEL PDF (Tema Admin - Azul) */
        .pdf-btn {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            width: 80px; height: 80px; background: #E3F2FD; border: 2px dashed #0f4c81; border-radius: 8px;
            color: #0f4c81; text-decoration: none; font-size: 11px; font-weight: bold; transition: 0.3s;
        }
        .pdf-btn i { font-size: 24px; margin-bottom: 5px; color: #d32f2f; }
        .pdf-btn:hover { background: #0f4c81; color: white; border-style: solid; }
        .pdf-btn:hover i { color: white; }
    </style>
</head>
<body>

    <div class="app-layout">
        
        <aside class="sidebar">
           <div class="sidebar-logo">
                <img src="../../img/logo.png" alt="Rojas Remodeling">
            </div>
            
            <nav class="sidebar-nav">
                <a href="../admin-dashboard.html">
                    <i class="fa-solid fa-house"></i> Inicio
                </a>
                <a href="../usuarios/usuarios.html">
                    <i class="fa-solid fa-users-gear"></i> Usuarios
                </a>
                <a href="../categorias/categorias.html">
                    <i class="fa-solid fa-tags"></i> Categorías
                </a>
                <a href="../trabajos/trabajos.html">
                    <i class="fa-solid fa-hammer"></i> Trabajos
                </a>
                <a href="../materiales/materiales.html">
                    <i class="fa-solid fa-boxes-stacked"></i> Materiales
                </a>
                <a href="evidencias.html" class="active">
                    <i class="fa-solid fa-camera"></i> Evidencias
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="page-title">Evidencias y Progreso de Trabajos</div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="admin-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container" style="margin-top: 0;">
                    
                    <div class="header-section" style="flex-wrap: wrap;">
                        <h2 style="margin: 0; color: #2B3674;">Supervisión de Proyectos</h2>
                        
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <label style="font-weight: 600; font-size: 0.9rem; color:#2B3674;">Filtrar por Jefe:</label>
                            <select id="filterManager" class="input-field" style="width: auto; padding: 10px;" onchange="filtrarTrabajos()">
                                <option value="ALL">Todos los Jefes</option>
                            </select>
                        </div>
                    </div>

                    <div id="jobsGrid" class="grid-cards" style="margin-top: 20px;">
                        </div>

                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalEvidencias">
        <div class="modal-container" style="max-width: 600px;">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-images"></i> Historial del Proyecto</span>
                <button onclick="cerrarModalEvidencias()" class="btn-close-modal">✕</button>
            </div>
            
            <div class="modal-body">
                <div id="jobDescriptionText" style="margin-bottom: 20px; padding: 12px; background: #E3F2FD; border: 1px solid #BBDEFB; border-radius: 8px; color: #0f4c81; font-size: 0.9rem;">
                    </div>

                <div id="evidencesTimeline">
                    </div>
            </div>
            
            <div class="modal-footer">
                <button onclick="cerrarModalEvidencias()" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="evidencias.js"></script>
</body>
</html>
