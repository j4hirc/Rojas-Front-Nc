<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Evidencias - Rojas Remodeling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="../../admin/admin.css"> 
    <link rel="stylesheet" href="../../admin/usuarios/usuarios.css"> 

    <style>
        /* Estilos específicos para la galería de evidencias */
        .timeline-update {
            background: #F9FAFC; border-left: 4px solid #198754; padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0;
        }
        .timeline-date { font-size: 0.8rem; color: #666; font-weight: 600; margin-bottom: 5px; display: block;}
        .timeline-comment { font-size: 0.95rem; color: #2B3674; margin-bottom: 10px; }
        .gallery-grid { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .gallery-img { 
            width: 80px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; 
            border: 2px solid #E0E5F2; transition: transform 0.2s;
        }
        .gallery-img:hover { transform: scale(1.05); border-color: #198754; }
        .empty-state { text-align: center; color: #A3AED0; padding: 30px; font-weight: 500; }
        
        /* NUEVO: ESTILO PARA EL BOTÓN DEL PDF */
        .pdf-btn {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            width: 80px; height: 80px; background: #e8f5e9; border: 2px dashed #198754; border-radius: 8px;
            color: #198754; text-decoration: none; font-size: 11px; font-weight: bold; transition: 0.3s;
        }
        .pdf-btn i { font-size: 24px; margin-bottom: 5px; color: #e65100; }
        .pdf-btn:hover { background: #198754; color: white; border-style: solid; }
        .pdf-btn:hover i { color: white; }

        /* =============================================
   RESPONSIVE PARA EVIDENCIAS (MÓVIL)
   ============================================= */

@media (max-width: 768px) {

    .usuarios-container {
        padding: 18px 15px !important;
        margin-top: 10px !important;
        border-radius: 16px;
    }

    .header-section {
        margin-bottom: 20px;
    }

    .header-section h2 {
        font-size: 1.35rem !important;
        text-align: left;
    }

    /* Grid de tarjetas - Muy importante para móviles */
    .grid-cards {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
        padding: 5px;
    }

    /* Ajuste de cada tarjeta en móvil */
    .card {
        padding: 18px !important;
        margin-bottom: 10px;
    }

    /* Contenido dentro de las tarjetas */
    .gallery-grid {
        gap: 8px;
        justify-content: flex-start;
    }

    .gallery-img {
        width: 70px;
        height: 70px;
    }

    /* Modal en móvil */
    .modal-container {
        width: 95% !important;
        max-width: none !important;
        margin: 10px auto;
    }

    .modal-body {
        padding: 18px 15px !important;
        max-height: 70vh;
    }
}

/* Para celulares pequeños */
@media (max-width: 480px) {

    .grid-cards {
        gap: 14px;
    }

    .card {
        padding: 16px !important;
    }

    .gallery-img {
        width: 65px;
        height: 65px;
    }
}
    </style>
</head>
<body>

    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../../img/logo.png" alt="Rojas Remodeling">
            </div>
            
            <nav class="sidebar-nav">
                <a href="../jefe-dashboard.html">
                    <i class="fa-solid fa-house"></i> Inicio
                </a>
                <a href="../usuarios/usuarios.html">
                    <i class="fa-solid fa-users-gear"></i> Mi Personal
                </a>
                <a href="../trabajos/trabajos.html">
                    <i class="fa-solid fa-hammer"></i> Mis Trabajos
                </a>
                <a href="evidencias.html" class="active">
                    <i class="fa-solid fa-camera"></i> Evidencias
                </a>
                <a href="../calendario/calendario.html"><i class="fa-solid fa-calendar-days"></i> Calendario</a>
                
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="page-title">Evidencias y Progreso de Trabajos</div>
                <div class="user-profile" style="color: #198754; background: #E8F5E9;">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="jefe-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container" style="margin-top: 0;">
                    
                    <div class="header-section">
                        <h2 style="margin: 0; color: #2B3674;">Supervisión de mis Proyectos</h2>
                    </div>

                    <div id="jobsGrid" class="grid-cards">
                        </div>

                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalEvidencias">
        <div class="modal-container" style="max-width: 600px;">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-images"></i> Historial del Proyecto</span>
                <button onclick="cerrarModalEvidencias()" class="btn-close-modal">✕</button>
            </div>
            
            <div class="modal-body">
                <div id="jobDescriptionText" style="margin-bottom: 20px; padding: 12px; background: #E8F5E9; border: 1px solid #C8E6C9; border-radius: 8px; color: #2e7d32; font-size: 0.9rem;">
                    </div>

                <div id="evidencesTimeline">
                    </div>
            </div>
            
            <div class="modal-footer">
                <button onclick="cerrarModalEvidencias()" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="evidencias-jefe.js"></script>
</body>
</html>
