<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Evidencias - Rojas Remodeling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="../../admin/admin.css"> 
    <link rel="stylesheet" href="../../admin/usuarios/usuarios.css"> 

    <style>
        /* Estilos específicos para la galería */
        .timeline-update {
            background: #F9FAFC; 
            border-left: 4px solid #198754; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 0 8px 8px 0;
        }
        .timeline-date { 
            font-size: 0.8rem; 
            color: #666; 
            font-weight: 600; 
            margin-bottom: 5px; 
            display: block;
        }
        .timeline-comment { 
            font-size: 0.95rem; 
            color: #2B3674; 
            margin-bottom: 10px; 
        }
        .gallery-grid { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            align-items: center; 
        }
        .gallery-img { 
            width: 80px; 
            height: 80px; 
            object-fit: cover; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 2px solid #E0E5F2; 
            transition: transform 0.2s;
        }
        .gallery-img:hover { 
            transform: scale(1.05); 
            border-color: #198754; 
        }
        .empty-state { 
            text-align: center; 
            color: #A3AED0; 
            padding: 30px; 
            font-weight: 500; 
        }

        /* Responsive - Evidencias */
        @media (max-width: 768px) {
            .usuarios-container {
                padding: 20px 15px !important;
                margin-top: 10px !important;
                border-radius: 16px;
            }

            .header-section {
                margin-bottom: 25px;
            }

            .header-section h2 {
                font-size: 1.4rem !important;
            }

            /* Filtros en móvil */
            .filters-container {
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .grid-cards {
                grid-template-columns: 1fr !important;
                gap: 16px !important;
            }

            .card {
                padding: 18px !important;
            }

            .gallery-img {
                width: 70px;
                height: 70px;
            }

            .modal-container {
                width: 95% !important;
                max-width: none !important;
            }

            .modal-body {
                padding: 18px 15px !important;
            }
        }

        @media (max-width: 480px) {
            .gallery-img {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../../img/logo.png" alt="Rojas Remodeling">
            </div>
            
            <nav class="sidebar-nav">
                <a href="../jefe-dashboard.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="../usuarios/usuarios.html"><i class="fa-solid fa-users-gear"></i> Mi Personal</a>
                <a href="../trabajos/trabajos.html"><i class="fa-solid fa-hammer"></i> Mis Trabajos</a>
                <a href="evidencias.html" class="active"><i class="fa-solid fa-camera"></i> Evidencias</a>
                <a href="../calendario/calendario.html"><i class="fa-solid fa-calendar-days"></i> Calendario</a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="page-title">Evidencias y Progreso de Trabajos</div>
                <div class="user-profile" style="color: #198754; background: #E8F5E9;">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="jefe-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container" style="margin-top: 0;">
                    
                    <div class="header-section">
                        <h2 style="margin: 0; color: #2B3674;">Supervisión de mis Proyectos</h2>

                        <!-- Filtros -->
                        <div class="filters-container" style="margin-top: 20px; display: flex; flex-wrap: wrap; gap: 15px;">
                            <div style="flex: 1; min-width: 240px;">
                                <label style="display:block; font-size:0.85rem; font-weight:600; color:#0f4c81; margin-bottom:6px;">
                                    Buscar Proyecto o Personal
                                </label>
                                <input type="text" id="searchInput" class="input-field" 
                                       placeholder="Buscar por cliente, jefe o subcontrata..." style="width:100%;">
                            </div>

                            <div style="flex: 1; min-width: 200px;">
                                <label style="display:block; font-size:0.85rem; font-weight:600; color:#0f4c81; margin-bottom:6px;">
                                    Estado de Obra
                                </label>
                                <select id="statusFilter" class="input-field" style="width:100%;">
                                    <option value="ALL">Todos los Estados</option>
                                    <option value="PENDING">Pendiente</option>
                                    <option value="IN_PROGRESS">En Progreso</option>
                                    <option value="COMPLETED">Completado</option>
                                </select>
                            </div>

                            <div style="flex: 1; min-width: 200px;">
                                <label style="display:block; font-size:0.85rem; font-weight:600; color:#0f4c81; margin-bottom:6px;">
                                    Filtrar por Jefe
                                </label>
                                <select id="jefeFilter" class="input-field" style="width:100%;">
                                    <option value="ALL">Todos los Jefes</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="jobsGrid" class="grid-cards"></div>

                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalEvidencias">
        <div class="modal-container" style="max-width: 600px;">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-images"></i> Historial del Proyecto</span>
                <button onclick="cerrarModalEvidencias()" class="btn-close-modal">✕</button>
            </div>
            
            <div class="modal-body">
                <div id="jobDescriptionText" style="margin-bottom: 20px; padding: 12px; background: #E8F5E9; border: 1px solid #C8E6C9; border-radius: 8px; color: #2e7d32; font-size: 0.9rem;"></div>
                <div id="evidencesTimeline"></div>
            </div>
            
            <div class="modal-footer">
                <button onclick="cerrarModalEvidencias()" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="evidencias-jefe.js"></script>
</body>
</html>
