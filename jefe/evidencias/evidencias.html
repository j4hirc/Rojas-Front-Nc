<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Evidencias - Rojas Remodeling</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../../admin/admin.css">
    <link rel="stylesheet" href="../../admin/usuarios/usuarios.css">

    <style>
        .timeline-update {
            background: #F9FAFC;
            border-left: 4px solid #198754;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }
        .timeline-date {
            font-size: 0.8rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }
        .timeline-comment {
            font-size: 0.95rem;
            color: #2B3674;
            margin-bottom: 10px;
        }
        .gallery-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .gallery-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #E0E5F2;
        }
        .pdf-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            border: 2px dashed #198754;
            border-radius: 8px;
            color: #198754;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
        }
        .empty-state { text-align: center; color: #A3AED0; padding: 30px; font-weight: 500; }

        .desc-cell {
            max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-size: 13px; color: #555; background: #f4fbf6; padding: 6px 10px; border-radius: 6px;
            border-left: 3px solid #198754; display: inline-block;
        }

        /* ==================== RESPONSIVE PARA MÓVIL ==================== */
        @media (max-width: 768px) {
            .app-layout, .main-content, .content-body { min-height: 100vh; }

            .usuarios-container {
                padding: 20px 15px !important;
                margin-top: 10px !important;
                border-radius: 16px;
                width: 100% !important;
            }

            .header-section h2 { font-size: 1.4rem !important; }
            .header-section > div { margin-left: 0 !important; margin-top: 15px; }

            .gallery-img, .pdf-btn { width: 70px !important; height: 70px !important; }
        }

        @media (max-width: 480px) {
            .gallery-img, .pdf-btn { width: 65px !important; height: 65px !important; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../../img/logo.png" alt="Rojas Remodeling">
            </div>

            <nav class="sidebar-nav">
                <a href="../jefe-dashboard.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="../usuarios/usuarios.html"><i class="fa-solid fa-users-gear"></i> Mi Personal</a>
                <a href="../trabajos/trabajos.html"><i class="fa-solid fa-hammer"></i> Mis Trabajos</a>
                <a href="evidencias.html" class="active"><i class="fa-solid fa-camera"></i> Evidencias</a>
                <a href="../calendario/calendario.html"><i class="fa-solid fa-calendar-days"></i> Calendario</a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="page-title">Evidencias y Progreso de Trabajos</div>
                <div class="user-profile" style="color: #198754; background: #E8F5E9;">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="jefe-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container" style="margin-top: 0;">

                    <div class="header-section" style="flex-wrap: wrap;">

                        <h2 style="margin:0; color:#2B3674; white-space:nowrap;">
                            Supervisión de mis Proyectos
                        </h2>

                        <div style="display:flex; align-items:flex-end; gap:15px; flex:1; margin-left:30px; flex-wrap: wrap;">

                            <div style="flex:2; min-width:200px;">
                                <label style="display:block; font-size:.85rem; font-weight:bold; color:#198754; margin-bottom:5px;">
                                    Buscar por Proyecto / Cliente
                                </label>
                                <input type="text" id="searchJobInput" class="input-field"
                                    placeholder="🔍 Escribe un nombre..." style="width:100%; margin:0;">
                            </div>

                            <div style="width:200px;">
                                <label style="display:block; font-size:.85rem; font-weight:bold; color:#198754; margin-bottom:5px;">
                                    Estado
                                </label>
                                <select id="filterStatusInput" class="input-field" style="width:100%; margin:0;">
                                    <option value="ALL">Todos los Estados</option>
                                    <option value="PENDING">Pendiente</option>
                                    <option value="IN_PROGRESS">En Progreso</option>
                                    <option value="COMPLETED">Completado</option>
                                    <option value="CANCELLED">Cancelado</option>
                                </select>
                            </div>

                            <div style="width:160px;">
                                <label style="display:block; font-size:.85rem; font-weight:bold; color:#198754; margin-bottom:5px;">
                                    Prioridad
                                </label>
                                <input type="number" id="filterPriorityInput" class="input-field"
                                    placeholder="Ej: 0, 1, 2..." style="width:100%; margin:0;" min="0">
                            </div>

                        </div>
                    </div>

                    <div class="table-container" style="width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 20px;">
                        <table class="user-table" style="width: 100%; min-width: 800px; border-collapse: collapse;">
                            <thead>
                                <tr>
                                    <th>Proyecto</th>
                                    <th>Jefe</th>
                                    <th>Subcontratista</th>
                                    <th>Estado</th>
                                    <th>Prioridad</th>
                                    <th>Evidencias</th>
                                </tr>
                            </thead>
                            <tbody id="jobTableBody"></tbody>
                        </table>
                    </div>

                    <div class="mobile-cards" id="mobileCardsContainer"></div>

                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalEvidencias">
        <div class="modal-container" style="max-width: 600px;">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-images"></i> Historial del Proyecto</span>
                <button onclick="cerrarModalEvidencias()" class="btn-close-modal">✕</button>
            </div>

            <div class="modal-body">
                <div id="jobDescriptionText" style="margin-bottom: 20px; padding: 12px; background: #E8F5E9; border: 1px solid #C8E6C9; border-radius: 8px; color: #2e7d32; font-size: 0.9rem;"></div>
                <div id="evidencesTimeline"></div>
            </div>

            <div class="modal-footer">
                <button onclick="cerrarModalEvidencias()" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="evidencias-jefe.js"></script>
</body>
</html>
