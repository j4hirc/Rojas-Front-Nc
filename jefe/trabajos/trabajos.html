<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Trabajos - Rojas Remodeling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="../../admin/admin.css"> 
    <link rel="stylesheet" href="../../admin/usuarios/usuarios.css"> 
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo" style="color: #198754;">
                <i class="fa-solid fa-hard-hat"></i>
                <span>Portal Jefe</span>
            </div>
            <nav class="sidebar-nav">
                <a href="../jefe-dashboard.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="../usuarios/usuarios.html"><i class="fa-solid fa-users-gear"></i> Mi Personal</a>
                <a href="trabajos.html" class="active"><i class="fa-solid fa-hammer"></i> Mis Trabajos</a>
                <a href="../evidencias/evidencias.html">
                    <i class="fa-solid fa-camera"></i> Evidencias
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout-sidebar" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="page-title">Gestión de Mis Trabajos</div>
                <div class="user-profile" style="color: #198754; background: #E8F5E9;">
                    <i class="fa-solid fa-user-tie"></i>
                    <span id="jefe-email-display">Cargando...</span>
                </div>
            </header>

            <div class="content-body">
                <div class="usuarios-container" style="margin-top: 0;">
                    <div class="header-section">
                        <h2 style="margin: 0; color: #2B3674;">Proyectos a mi Cargo</h2>
                        <button class="btn-add" onclick="abrirModalCrearJob()" style="background: #e65100;">
                            <i class="fa-solid fa-plus"></i> Nuevo Trabajo
                        </button>
                    </div>

                    <div class="table-container">
                        <table class="user-table">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Dirección</th>
                                    <th>Empleado Asignado</th>
                                    <th>Estado</th>
                                    <th>Pago ($)</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="jobTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalJob">
        <div class="modal-container" style="max-width: 750px;">
            <div class="modal-header">
                <span id="modalTitulo"><i class="fa-solid fa-hammer"></i> Nuevo Trabajo</span>
                <button onclick="cerrarModalJob()" class="btn-close-modal">✕</button>
            </div>
            
            <div class="modal-body">
                <form id="formJob">
                    <input type="hidden" id="jobId"> 
                    
                    <h4 style="margin-bottom: 10px; color: #0f4c81; border-bottom: 1px solid #eee; padding-bottom: 5px;">Datos del Cliente y Proyecto</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre del Cliente</label>
                            <input type="text" id="jobClientName" class="input-field" required placeholder="Ej: Familia Rojas">
                        </div>
                        <div class="form-group">
                            <label>Teléfono del Cliente</label>
                            <input type="text" id="jobClientPhone" class="input-field" required placeholder="0999999999">
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 15px;">
                        <label>Descripción del Trabajo</label>
                        <textarea id="jobDesc" class="input-field" rows="2" required placeholder="Ej: Remodelación..."></textarea>
                    </div>

                    <h4 style="margin-top: 20px; margin-bottom: 10px; color: #0f4c81; border-bottom: 1px solid #eee; padding-bottom: 5px;">Ubicación</h4>
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="jobAddress" class="input-field" required placeholder="Dirección exacta">
                    </div>
                    
                    <div class="form-group" style="margin-top: 15px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label style="margin-bottom: 0;">Selecciona en el mapa</label>
                            <button type="button" onclick="obtenerMiUbicacion()" style="background: #e65100; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold;">
                                <i class="fa-solid fa-location-crosshairs"></i> Mi Ubicación
                            </button>
                        </div>
                        <div id="jobMap" style="height: 250px; width: 100%; border-radius: 12px; border: 1px solid #E0E5F2; z-index: 1;"></div>
                    </div>

                    <div class="form-row" style="margin-top: 15px; display: none;"> <div class="form-group">
                            <input type="number" id="jobLat" class="input-field" step="any" required readonly>
                            <input type="number" id="jobLng" class="input-field" step="any" required readonly>
                        </div>
                    </div>

                    <div class="form-row" style="margin-top: 15px;">
                        <div class="form-group">
                            <label>Código Caja de Seguridad</label>
                            <input type="text" id="jobSafeBox" class="input-field" placeholder="Opcional">
                        </div>
                        <div class="form-group">
                            <label>Pago Asignado ($)</label>
                            <input type="number" id="jobPay" class="input-field" step="0.01" min="0" required placeholder="500.00">
                        </div>
                    </div>

                    <div class="form-row" style="margin-top: 15px;">
                        <div class="form-group">
                            <label>Estado del Trabajo</label>
                            <select id="jobStatus" class="input-field" required>
                                <option value="PENDING">Pendiente</option>
                                <option value="IN_PROGRESS">En Progreso</option>
                                <option value="COMPLETED">Completado</option>
                                <option value="CANCELLED">Cancelado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Empleado Asignado</label>
                            <select id="jobEmployee" class="input-field" required>
                                <option value="">Cargando empleados...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 15px;">
                        <label>Materiales Requeridos</label>
                        <div id="materialsContainer" style="max-height: 120px; overflow-y: auto; background: #F9FAFC; padding: 10px; border: 1px solid #E0E5F2; border-radius: 8px;">
                            Cargando materiales...
                        </div>
                    </div>

                </form>
            </div>
            
            <div class="modal-footer">
                <button onclick="cerrarModalJob()" class="btn-secondary">Cancelar</button>
                <button onclick="guardarTrabajo()" class="btn-primary" style="background: #e65100;">Guardar Trabajo</button>
            </div>
        </div>
    </div>

    <script type="module" src="trabajos-jefe.js"></script>
</body>
</html>
